{% extends 'vetcar/base.html' %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<h1>{{ titulo }}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Guardar</button>
    <a class="btn btn-gray" href="{% url 'vetcar:listar' entidad %}">Cancelar</a>
</form>
{% endblock %}
