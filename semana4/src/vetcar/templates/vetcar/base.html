<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Clínica Veterinaria{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --clinica-primaria: #2F6D5E;
            --clinica-primaria-oscura: #234F44;
            --clinica-acento: #E8815A;
            --clinica-acento-oscuro: #C96540;
            --clinica-fondo: #F6F4EF;
            --clinica-superficie: #FFFFFF;
            --clinica-texto: #263238;
            --clinica-texto-suave: #607169;
            --clinica-borde: #DCE3DE;
        }

        body {
            background-color: var(--clinica-fondo);
            color: var(--clinica-texto);
            font-family: 'Inter', sans-serif;
        }

        h1, h2, h3, h4, .navbar-brand {
            font-family: 'Poppins', sans-serif;
        }

        .navbar-clinica {
            background-color: var(--clinica-primaria);
        }

        .navbar-clinica .navbar-brand,
        .navbar-clinica .nav-link {
            color: #F6F4EF !important;
            font-weight: 500;
        }

        .navbar-clinica .nav-link:hover {
            color: var(--clinica-acento) !important;
        }

        .navbar-clinica .nav-link.activo {
            color: var(--clinica-acento) !important;
            font-weight: 600;
        }

        .card-clinica {
            background-color: var(--clinica-superficie);
            border: 1px solid var(--clinica-borde);
            border-radius: 1rem;
            box-shadow: 0 4px 18px rgba(35, 79, 68, 0.06);
        }

        /* Botones propios: nada de btn-primary / btn-secondary de Bootstrap */
        .btn-clinica {
            background-color: var(--clinica-primaria);
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 0.55rem 1.5rem;
            font-weight: 600;
            font-size: 0.92rem;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        .btn-clinica:hover {
            background-color: var(--clinica-primaria-oscura);
            color: #fff;
            transform: translateY(-1px);
        }

        .btn-clinica-acento {
            background-color: var(--clinica-acento);
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 0.55rem 1.5rem;
            font-weight: 600;
            font-size: 0.92rem;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        .btn-clinica-acento:hover {
            background-color: var(--clinica-acento-oscuro);
            color: #fff;
            transform: translateY(-1px);
        }

        .btn-clinica-fantasma {
            background-color: transparent;
            color: var(--clinica-primaria);
            border: 1.5px solid var(--clinica-primaria);
            border-radius: 50px;
            padding: 0.5rem 1.4rem;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .btn-clinica-fantasma:hover {
            background-color: var(--clinica-primaria);
            color: #fff;
        }

        .btn-clinica-peligro {
            background-color: transparent;
            color: #B4483A;
            border: 1.5px solid #B4483A;
            border-radius: 50px;
            padding: 0.5rem 1.3rem;
            font-weight: 600;
            font-size: 0.88rem;
            transition: all 0.2s ease;
        }

        .btn-clinica-peligro:hover {
            background-color: #B4483A;
            color: #fff;
        }

        .badge-clinica {
            background-color: rgba(47, 109, 94, 0.12);
            color: var(--clinica-primaria-oscura);
            border-radius: 50px;
            padding: 0.35rem 0.8rem;
            font-weight: 600;
            font-size: 0.78rem;
        }

        .badge-clinica-inactivo {
            background-color: rgba(180, 72, 58, 0.1);
            color: #B4483A;
            border-radius: 50px;
            padding: 0.35rem 0.8rem;
            font-weight: 600;
            font-size: 0.78rem;
        }

        .texto-suave {
            color: var(--clinica-texto-suave);
        }

        .logo-huella {
            width: 26px;
            height: 26px;
            fill: var(--clinica-acento);
            margin-right: 0.4rem;
            vertical-align: -6px;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--clinica-primaria);
            box-shadow: 0 0 0 0.2rem rgba(47, 109, 94, 0.15);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-clinica mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="{% url 'listar_mascotas' %}">
                <svg class="logo-huella" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                    <ellipse cx="32" cy="42" rx="16" ry="13"/>
                    <ellipse cx="12" cy="24" rx="7" ry="9" transform="rotate(-18 12 24)"/>
                    <ellipse cx="27" cy="14" rx="7.5" ry="9.5" transform="rotate(-6 27 14)"/>
                    <ellipse cx="43" cy="14" rx="7.5" ry="9.5" transform="rotate(6 43 14)"/>
                    <ellipse cx="54" cy="25" rx="7" ry="9" transform="rotate(18 54 25)"/>
                </svg>
                Clínica Veterinaria
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navClinica">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navClinica">
                <ul class="navbar-nav ms-auto gap-lg-2">
                    <li class="nav-item"><a class="nav-link" href="{% url 'listar_duenos' %}">Dueños</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'listar_veterinarios' %}">Veterinarios</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'listar_razas' %}">Razas</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'listar_mascotas' %}">Mascotas</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'listar_consultas' %}">Consultas</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'listar_vacunaciones' %}">Vacunaciones</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        {% block contenido %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
