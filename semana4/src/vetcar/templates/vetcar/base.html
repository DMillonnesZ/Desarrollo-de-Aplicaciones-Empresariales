<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>VetCar - {% block titulo %}{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; }
        nav { background: #2c7a7b; padding: 12px 20px; }
        nav a { color: #fff; text-decoration: none; margin-right: 18px; font-weight: bold; }
        main { max-width: 1000px; margin: 25px auto; background: #fff; padding: 25px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #e6fffa; }
        .btn { display: inline-block; padding: 6px 12px; border-radius: 4px; text-decoration: none;
               color: #fff; background: #2c7a7b; border: none; cursor: pointer; font-size: 14px; }
        .btn-warn { background: #d69e2e; } .btn-danger { background: #c53030; } .btn-gray { background: #718096; }
        form p { margin: 10px 0; } input, select, textarea { width: 100%; padding: 6px; box-sizing: border-box; }
        .tarjetas { display: flex; gap: 20px; }
        .tarjeta { flex: 1; background: #e6fffa; padding: 20px; border-radius: 8px; text-align: center; }
        .tarjeta h2 { margin: 0; font-size: 36px; color: #2c7a7b; }
    </style>
</head>
<body>
<nav>
    <a href="{% url 'vetcar:inicio' %}">🐾 VetCar</a>
    <a href="{% url 'vetcar:listar' 'duenos' %}">Dueños</a>
    <a href="{% url 'vetcar:listar' 'razas' %}">Razas</a>
    <a href="{% url 'vetcar:listar' 'veterinarios' %}">Veterinarios</a>
    <a href="{% url 'vetcar:listar' 'mascotas' %}">Mascotas</a>
    <a href="{% url 'vetcar:listar' 'consultas' %}">Consultas</a>
</nav>
<main>
    {% block contenido %}{% endblock %}
</main>
</body>
</html>
