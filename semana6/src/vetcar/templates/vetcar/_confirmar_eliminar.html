
<!-- Tarjeta principal de confirmación de eliminación -->
<div class="card-clinica p-4 mx-auto" style="max-width: 520px;">

    <!-- Icono de advertencia -->
    <div class="text-center mb-3">
        <i class="bi bi-exclamation-triangle" style="font-size: 2.5rem; color: #B4483A;"></i>
    </div>

    <!-- Pregunta de confirmación enviada desde la vista de Django -->
    <h4 class="text-center mb-2">{{ pregunta }}</h4>

    <!-- Mensaje que advierte que la eliminación es irreversible -->
    <p class="texto-suave text-center mb-4">
        Esta acción no se puede deshacer.

        <!-- Verifica si existen registros relacionados -->
        {% if cantidad_relacionados %}

            <!-- Muestra la cantidad de registros que impiden la eliminación -->
            {{ sujeto }} tiene <strong>{{ cantidad_relacionados }}</strong> {{ nombre_relacionados }}; no podrá eliminarse mientras existan.

        {% endif %}
    </p>

    <!-- Formulario para confirmar la eliminación mediante POST -->
    <form method="post" class="d-flex justify-content-center gap-2">

        <!-- Token de seguridad CSRF obligatorio en Django -->
        {% csrf_token %}

        <!-- Botón que envía la solicitud de eliminación -->
        <button type="submit" class="btn-clinica-peligro">
            <i class="bi bi-trash me-1"></i> Sí, eliminar
        </button>

        <!-- Enlace para cancelar y regresar sin eliminar -->
        <a href="{{ url_cancelar }}" class="btn-clinica-fantasma">
            Cancelar
        </a>

    </form>
</div>
