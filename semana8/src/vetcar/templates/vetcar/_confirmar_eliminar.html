<div class="card-clinica p-4 mx-auto" style="max-width: 520px;">
    <div class="text-center mb-3">
        <i class="bi bi-exclamation-triangle" style="font-size: 2.5rem; color: #B4483A;"></i>
    </div>
    <h4 class="text-center mb-2">{{ pregunta }}</h4>
    <p class="texto-suave text-center mb-4">
        Esta acción no se puede deshacer.
        {% if cantidad_relacionados %}
            {{ sujeto }} tiene <strong>{{ cantidad_relacionados }}</strong> {{ nombre_relacionados }}; no podrá eliminarse mientras existan.
        {% endif %}
    </p>

    <form method="post" class="d-flex justify-content-center gap-2">
        {% csrf_token %}
        <button type="submit" class="btn-clinica-peligro">
            <i class="bi bi-trash me-1"></i> Sí, eliminar
        </button>
        <a href="{{ url_cancelar }}" class="btn-clinica-fantasma">
            Cancelar
        </a>
    </form>
</div>
